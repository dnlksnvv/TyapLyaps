<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#1a1a1a"/>
  
  <!-- Main circle -->
  <circle cx="256" cy="256" r="180" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="4"/>
  
  <!-- Task/Collection icon -->
  <rect x="180" y="180" width="152" height="152" rx="16" fill="#3a3a3a" stroke="#5a5a5a" stroke-width="2"/>
  
  <!-- Plus sign -->
  <line x1="256" y1="220" x2="256" y2="292" stroke="#8b949e" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="256" x2="292" y2="256" stroke="#8b949e" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Small dots representing tasks -->
  <circle cx="200" cy="200" r="4" fill="#8b949e"/>
  <circle cx="312" cy="200" r="4" fill="#8b949e"/>
  <circle cx="200" cy="312" r="4" fill="#8b949e"/>
  <circle cx="312" cy="312" r="4" fill="#8b949e"/>
</svg>
